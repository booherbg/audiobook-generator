<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Rerum Novarum cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241f17"/>
      <stop offset="1" stop-color="#14110c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect x="28" y="28" width="544" height="544" rx="18" fill="none" stroke="#d9b25b" stroke-opacity="0.45" stroke-width="2"/>
  <!-- A balance scale: justice between capital and labor, the encyclical's central concern. -->
  <g stroke="#d9b25b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="300" y1="156" x2="300" y2="262"/>
    <line x1="238" y1="178" x2="362" y2="178"/>
    <circle cx="300" cy="150" r="6" fill="#d9b25b"/>
    <line x1="300" y1="262" x2="270" y2="262"/>
    <line x1="300" y1="262" x2="330" y2="262"/>
    <!-- left pan -->
    <path d="M238 178 L222 214 L254 214 Z"/>
    <!-- right pan -->
    <path d="M362 178 L346 214 L378 214 Z"/>
  </g>
  <text x="300" y="372" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#ece6da" letter-spacing="1">Rerum</text>
  <text x="300" y="430" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#ece6da" letter-spacing="1">Novarum</text>
  <text x="300" y="486" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="20" fill="#a59c89">Pope Leo XIII</text>
  <text x="300" y="524" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#8a8170">On capital and labor</text>
</svg>
