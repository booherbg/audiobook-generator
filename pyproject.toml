[project]
name = "audiobook"
version = "0.1.0"
description = "Local audiobook generator: URL -> chaptered, loudness-normalized MP3s + manifest for a static web player."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "trafilatura>=1.12",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "kokoro-onnx>=0.4",
  "soundfile>=0.12",
  "numpy>=1.26",
  "faster-whisper>=1.0",
  "jiwer>=3.0",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
audiobook = "pipeline.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
markers = ["slow: requires Kokoro model / ffmpeg render (deselect with -m 'not slow')"]
